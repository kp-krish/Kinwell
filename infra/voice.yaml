AWSTemplateFormatVersion: "2010-09-09"
Description: >
  HeatCheck voice server. Twilio -> CloudFront (HTTPS/WSS) -> ALB -> ECS Fargate,
  which streams each call to Amazon Nova 2 Sonic in us-west-2.

Parameters:
  VpcId: { Type: AWS::EC2::VPC::Id }
  SubnetIds: { Type: List<AWS::EC2::Subnet::Id> }
  ImageUri: { Type: String }
  SecretArn: { Type: String, Description: Secrets Manager secret with app keys (JSON) }
  CloudFrontPrefixList: { Type: String, Default: pl-b6a144df }
  DemoSecondsPerMinute: { Type: String, Default: "4" }
  NovaModelArn:
    Type: String
    Default: arn:aws:bedrock:us-west-2::foundation-model/amazon.nova-2-sonic-v1:0

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: /heatcheck-sunhacks/voice, RetentionInDays: 14 }

  Cluster:
    Type: AWS::ECS::Cluster
    Properties: { ClusterName: heatcheck-sunhacks }

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-app-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{ Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref SecretArn }]

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }]
      Policies:
        - PolicyName: nova-sonic
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:InvokeModelWithBidirectionalStream]
                Resource: !Ref NovaModelArn
              - Effect: Allow
                Action: [states:StartExecution]
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:hcs-*"
              - Effect: Allow
                Action: [states:SendTaskSuccess, states:SendTaskFailure]
                Resource: "*"

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HeatCheck ALB - CloudFront only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixList }

  TaskSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HeatCheck voice tasks - from ALB only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: hcs-voice
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: "600" }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: hcs-voice
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "20" }

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: HeatCheck voice (HTTPS + WebSockets for Twilio)
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: hcs-voice
      Cpu: "512"
      Memory: "1024"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: voice
          Image: !Ref ImageUri
          PortMappings: [{ ContainerPort: 8080 }]
          Environment:
            - { Name: PUBLIC_HOST, Value: !GetAtt Distribution.DomainName }
            - { Name: NOVA_REGION, Value: us-west-2 }
            - { Name: INFRA_REGION, Value: !Ref AWS::Region }
            - { Name: DEMO_SECONDS_PER_MINUTE, Value: !Ref DemoSecondsPerMinute }
            - { Name: STATE_MACHINE_ARN, Value: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:hcs-escalation" }
          Secrets:
            - { Name: TWILIO_ACCOUNT_SID, ValueFrom: !Sub "${SecretArn}:TWILIO_ACCOUNT_SID::" }
            - { Name: TWILIO_AUTH_TOKEN, ValueFrom: !Sub "${SecretArn}:TWILIO_AUTH_TOKEN::" }
            - { Name: TWILIO_PHONE_NUMBER, ValueFrom: !Sub "${SecretArn}:TWILIO_PHONE_NUMBER::" }
            - { Name: DEMO_PHONE_NUMBER, ValueFrom: !Sub "${SecretArn}:DEMO_PHONE_NUMBER::" }
            - { Name: MONGODB_URI, ValueFrom: !Sub "${SecretArn}:MONGODB_URI::" }
            - { Name: GEMINI_API_KEY, ValueFrom: !Sub "${SecretArn}:GEMINI_API_KEY::" }
            - { Name: SUPERMEMORY_API_KEY, ValueFrom: !Sub "${SecretArn}:SUPERMEMORY_API_KEY::" }
            - { Name: MARITIME_API_KEY, ValueFrom: !Sub "${SecretArn}:MARITIME_API_KEY::" }
            - { Name: SCOUT_TOKEN, ValueFrom: !Sub "${SecretArn}:SCOUT_TOKEN::" }
            - { Name: INTERNAL_TOKEN, ValueFrom: !Sub "${SecretArn}:INTERNAL_TOKEN::" }
            - { Name: DASHBOARD_KEY, ValueFrom: !Sub "${SecretArn}:DASHBOARD_KEY::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: voice

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      ServiceName: hcs-voice
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1
      TaskDefinition: !Ref TaskDef
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200 }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref TaskSg]
      LoadBalancers:
        - { ContainerName: voice, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

Outputs:
  PublicHost: { Value: !GetAtt Distribution.DomainName }
  AlbDns: { Value: !GetAtt Alb.DNSName }
  TaskRoleArn: { Value: !GetAtt TaskRole.Arn }
